name: Daily Quant Engine Run

on:
  workflow_dispatch: # Allows manual trigger anytime
  schedule:
    - cron: '30 13 * * *' # Runs daily at 13:30 UTC (7:00 PM IST)

permissions:
  contents: write # Grants permission to commit and push updated files back to the repo

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout fresh code
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Quant Libraries
      run: |
        pip install --no-cache-dir pandas yfinance pyarrow fastparquet tqdm

    - name: Emergency File Alignment Fix
      run: |
        echo "=== Current Working Directory Content ==="
        ls -R
        
        mkdir -p resources
        
        if [ -f "universe.csv" ]; then
          mv universe.csv resources/universe.csv
        fi

    - name: Execute Momentum Engine
      run: |
        python main.py

    - name: Commit and Push Updated Output CSVs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add output files generated by main.py
        git add .
        
        # Commit and push only if changes were detected
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily momentum scan output [skip ci]" && git push)
